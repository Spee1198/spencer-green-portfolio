name: Rename portfolio to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          if [ -f spencer-green-portfolio.html ]; then
            git config user.name "Spee1198"
            git config user.email "Spee1198@users.noreply.github.com"
            git mv spencer-green-portfolio.html index.html
            git commit -m "Rename latest portfolio file to index.html"
            git push
          else
            echo "spencer-green-portfolio.html not found"
            ls -la
            exit 1
          fi
