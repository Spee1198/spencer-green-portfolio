name: Replace portfolio files
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/replace-files.yml
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index and video
        run: |
          git config user.name "Spee1198"
          git config user.email "Spee1198@users.noreply.github.com"
          git mv spencer-green-portfolio.html index.html
          git rm assets/paddlepost-demo.mp4
          git mv assets/paddlepost-promo-v9.mp4 assets/paddlepost-demo.mp4
          git status --short
          git commit -m "Replace index.html with latest portfolio and PaddlePost demo with v9 video"
          git push
